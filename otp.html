<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP — Sustainability Digital Twin</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
      }
    }
  </script>
</head>
<body class="auth-page">
  <div class="auth-background"></div>

  <main class="auth-card">
    <div class="auth-header">
      <span class="brand-mark">🔐</span>
      <h1>Two-Step Verification</h1>
      <p>Enter the 6-digit code sent to <strong id="email-display"></strong></p>
    </div>

    <form id="otp-form" class="auth-form" autocomplete="off">
      <div class="otp-inputs">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="Digit 1" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="Digit 2" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="Digit 3" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="Digit 4" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="Digit 5" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" aria-label="Digit 6" />
      </div>

      <div id="otp-error" class="auth-error" role="alert"></div>

      <button id="btn-verify" type="submit" class="primary auth-submit">
        <span class="btn-text">Verify OTP</span>
        <span class="btn-loader" hidden></span>
      </button>
    </form>

    <div class="otp-actions">
      <span id="countdown">Resend available in 05:00</span>
      <button id="btn-resend" type="button" disabled>Resend OTP</button>
    </div>

    <div class="auth-footer">
      <a href="login.html">← Back to login</a>
    </div>
  </main>

  <script type="module" src="js/otp.js"></script>
</body>
</html>
